name: Lumiflex to Nightscout
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          LUMIFLEX_TOKEN: ${{ secrets.LUMIFLEX_TOKEN }}
          NIGHTSCOUT_URL: ${{ secrets.NIGHTSCOUT_URL }}
          NIGHTSCOUT_SECRET: ${{ secrets.NIGHTSCOUT_SECRET }}
        run: python sync.py
